<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動物在哪裡？｜快樂小隊 親子探索懶人任務盒</title>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3ee;--panel:#ffffff;--ink:#5a3b2e;--sub:#9a7f72;--line:#f4d9d0;--pink:#f08aa4;--on-pink:#fff;--sun:#ffe07a;--sky:#bfe3f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2024;--panel:#372a2f;--ink:#fbeee8;--sub:#c9b2a8;--line:#4d3b42;--pink:#f59ab2;--on-pink:#3a1622;--sky:#35525e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2024;--panel:#372a2f;--ink:#fbeee8;--sub:#c9b2a8;--line:#4d3b42;--pink:#f59ab2;--on-pink:#3a1622;--sky:#35525e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
header{text-align:center;padding:26px 16px 4px}
.brand{display:inline-block;padding:4px 18px;border-radius:999px;background:var(--pink);color:var(--on-pink);font-weight:700;font-size:17px;letter-spacing:.12em}
h1{margin:10px 0 0;font-size:clamp(40px,10vw,68px);font-weight:900;letter-spacing:.08em}
header p{margin:2px 0 0;color:var(--sub);font-size:18px;font-weight:700}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px}
nav button{font:inherit;font-weight:700;font-size:18px;padding:8px 20px;border-radius:999px;border:2px solid var(--pink);background:transparent;color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--pink);color:var(--on-pink)}
button:focus-visible,label:focus-within{outline:3px solid var(--sun);outline-offset:3px}
main{max-width:1020px;margin:0 auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
.tile{position:relative;border:0;padding:12px 12px 16px;font:inherit;color:inherit;cursor:pointer;text-align:center;background:var(--panel);border-radius:34px 20px 38px 22px;box-shadow:0 0 0 2px var(--line)}
.tile:nth-child(even){border-radius:22px 38px 20px 34px}
.pic{position:relative;aspect-ratio:1/1;border-radius:26px;overflow:hidden;display:grid;place-items:center;background:var(--c);padding:12px}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.6) 0,rgba(255,255,255,0) 38%);pointer-events:none}
.pic img{max-width:100%;max-height:100%;object-fit:contain;transition:filter .3s}
.dot{position:absolute;right:14px;bottom:14px;width:15px;height:15px;border-radius:50%;background:repeating-radial-gradient(circle,#666 0 2px,#aaa 2px 4px);z-index:2;opacity:.8}
.tile b{display:block;font-size:22px;margin-top:8px}
.say{display:inline-block;margin-top:2px;padding:2px 14px;border-radius:999px;background:var(--sun);color:#5a3b2e;font-weight:700}
.tile.playing .pic{animation:wig .5s ease-in-out 3}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) scale(1.04)}75%{transform:rotate(5deg) scale(1.04)}}
.tile.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.tile.playing .pic,.tile.no,.pop{animation:none!important}}
.fact{display:block;margin-top:8px;font-size:15px;line-height:1.55;color:var(--sub);font-weight:400}
.leftbar{font-size:20px;font-weight:700;margin-bottom:8px;min-height:32px}
.love:disabled{opacity:.4;cursor:default}
.hidden{display:none}
.center{text-align:center}
.big{font:inherit;font-weight:900;font-size:24px;padding:14px 32px;border:0;border-radius:999px;background:var(--pink);color:var(--on-pink);cursor:pointer;margin:4px 0 14px}
.opt{font:inherit;font-weight:700;font-size:16px;padding:6px 16px;border-radius:999px;border:2px solid var(--pink);background:transparent;color:var(--ink);cursor:pointer;margin-bottom:16px}
#msg{min-height:38px;font-size:24px;font-weight:700;margin-bottom:12px}
.love{font:inherit;font-weight:900;font-size:18px;margin-top:8px;padding:6px 18px;border-radius:999px;border:0;background:var(--pink);color:var(--on-pink);cursor:pointer}
.love .h{display:inline-block}
.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.6)}}
.cnt{display:block;font-size:15px;color:var(--sub);font-weight:700}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:10px;margin:8px 0}
.rank img{width:44px;height:44px;object-fit:contain;background:var(--c);border-radius:14px;padding:3px}
.rank .nm{width:64px;font-weight:700}
.bar{flex:1;height:22px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:999px;transition:width .5s}
.rank .n{width:44px;text-align:right;font-weight:900}
.panel{background:var(--panel);border-radius:26px;box-shadow:0 0 0 2px var(--line);padding:22px;margin:22px 0}
.panel h2{margin:0 0 8px;font-size:22px}
.panel ol{margin:0;padding-left:22px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row img{width:48px;height:48px;object-fit:contain;background:var(--c);border-radius:14px;padding:3px}
.row strong{min-width:60px}
.btn{font:inherit;font-size:15px;font-weight:700;padding:5px 14px;border-radius:999px;border:2px solid var(--pink);background:transparent;color:var(--ink);cursor:pointer}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
small{color:var(--sub)}
footer{text-align:center;color:var(--sub);padding:8px 16px 32px;font-weight:700}
</style>
</head>
<body>
<header>
  <span class="brand">快樂小隊</span>
  <h1>動物在哪裡？</h1>
  <p>親子探索懶人任務盒</p>
</header>
<nav role="tablist" aria-label="頁面">
  <button role="tab" id="t-learn" aria-selected="true">聽聽看</button>
  <button role="tab" id="t-quiz" aria-selected="false">猜猜看</button>
  <button role="tab" id="t-vote" aria-selected="false">愛心投票</button>
  <button role="tab" id="t-parent" aria-selected="false">家長區</button>
</nav>
<main>
  <section id="v-learn" class="center">
    <div class="grid" id="g-learn"></div>
  </section>
  <section id="v-quiz" class="center hidden">
    <button class="big" id="ask">🔊 聽聽看，是誰在叫？</button>
    <div id="msg" aria-live="polite">按下按鈕，然後找出那隻動物</div>
    <div class="grid" id="g-quiz"></div>
  </section>
  <section id="v-vote" class="center hidden">
    <h2 style="margin:0">你最喜歡哪一隻？</h2>
    <p style="margin:4px 0 8px;color:var(--sub)" id="vnote">按愛心，投給你喜歡的動物</p>
    <div class="grid" id="g-vote"></div>
    <div class="panel" style="text-align:left"><h2>目前的人氣排行</h2><ul class="rank" id="rank"></ul></div>
    <button class="opt" id="resetVotes">清除票數</button>
  </section>
  <section id="v-parent" class="hidden">
    <div class="panel">
      <h2>任務玩法</h2>
      <ol>
        <li>把每隻動物的彩色圖片印出來，貼在底板上。圖卡上的動物用灰階呈現。</li>
        <li>動物壓克力板背面貼魔鬼氈，請孩子找到對應的圖，把牠吸上去。</li>
        <li>吸對之後，點網站上的動物，聽聽牠怎麼叫。</li>
        <li>最後到「愛心投票」，投給最喜歡的動物。</li>
      </ol>
      <p><small>材料：動物壓克力板、魔鬼氈、彩色列印的動物圖卡。</small></p>
    </div>
  </section>
</main>
<footer>快樂小隊 ｜ 親子探索懶人任務盒</footer>

let ctx;
function ac(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function note(t0,o){
  const c=ac(),osc=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
  const d=o.d,f=o.f,t=c.currentTime+t0;
  osc.type=o.type||'sawtooth';
  fl.type=o.bp?'bandpass':'lowpass';fl.frequency.value=o.bp||o.lp||1500;if(o.bp)fl.Q.value=3;
  osc.frequency.setValueAtTime(f[0],t);osc.frequency.linearRampToValueAtTime(f[1],t+d);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vd;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+.05)}
  const v=o.g||.3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.linearRampToValueAtTime(0,t+d);
  osc.connect(fl);fl.connect(g);g.connect(c.destination);osc.start(t);osc.stop(t+d+.05);
}
const SYN={
 dog(){note(0,{f:[520,300],d:.18,lp:2500});note(.26,{f:[520,300],d:.2,lp:2500})},
 pig(){note(0,{f:[200,140],d:.22,lp:900,vib:30,vd:20,g:.45});note(.3,{f:[190,130],d:.3,lp:900,vib:30,vd:20,g:.45})},
 chick(){[0,.14,.28].forEach(t=>note(t,{type:'triangle',f:[1900,2500],d:.09,g:.25}))},
 unicorn(){note(0,{f:[600,950],d:.3,bp:1400,vib:20,vd:30});note(.3,{f:[950,300],d:.7,bp:1200,vib:25,vd:40})},
 penguin(){note(0,{f:[420,360],d:.3,bp:900,vib:12,vd:25,g:.35});note(.4,{f:[420,340],d:.35,bp:900,vib:12,vd:25,g:.35})},
 dolphin(){[0,.07,.14].forEach(t=>note(t,{type:'square',f:[3000,3000],d:.03,g:.12}));note(.3,{type:'sine',f:[1200,2600],d:.3,g:.3});note(.6,{type:'sine',f:[2600,1500],d:.3,g:.3})},
 fish(){[0,.16,.3,.5].forEach((t,i)=>note(t,{type:'sine',f:[300+i*40,700],d:.1,g:.3}))},
 squirrel(){[0,.1,.2,.3].forEach(t=>note(t,{type:'triangle',f:[1500,2200],d:.06,g:.25}))},
 turtle(){note(0,{type:'sine',f:[90,115],d:.6,lp:300,g:.6})},
 bat(){[0,.15,.3].forEach(t=>note(t,{type:'sine',f:[3000,4200],d:.1,g:.15}))}
};
function play(a){SYN[a.id]()}
const pic=a=>`<div class="pic" style="--c:${a.c}"><img src="${IMG[a.id]}" alt="${a.n}"><i class="dot"></i></div>`;
function bounce(t){t.classList.remove('playing');void t.offsetWidth;t.classList.add('playing')}
/* learn */
function renderLearn(){
  const g=document.getElementById('g-learn');
  g.innerHTML=A.map(a=>`<button class="tile" data-id="${a.id}" aria-label="${a.n}，點一下聽叫聲">${pic(a)}<b>${a.n}</b><span class="say">🔊 ${a.s}</span><span class="fact">${a.f}</span></button>`).join('');
  g.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{play(A.find(x=>x.id===t.dataset.id));bounce(t)});
}
/* quiz */
let target=null,stars=0;
function renderQuiz(){
  const g=document.getElementById('g-quiz');
  g.innerHTML=A.map(a=>`<button class="tile" data-id="${a.id}" aria-label="${a.n}">${pic(a)}<b>${a.n}</b></button>`).join('');
  g.querySelectorAll('.tile').forEach(t=>t.onclick=()=>answer(t));
}
function ask(){let n;do{n=A[Math.floor(Math.random()*A.length)]}while(target&&n.id===target.id);target=n;play(n);document.getElementById('msg').textContent='牠是誰呢？';document.getElementById('ask').textContent='🔊 再聽一次'}
function answer(t){
  const m=document.getElementById('msg');
  if(!target){m.textContent='先按上面的按鈕，聽聽看吧';return}
  if(t.dataset.id===target.id){stars++;m.textContent='答對了！是'+target.n+' '+'⭐'.repeat(Math.min(stars,10));target=null;document.getElementById('ask').textContent='🔊 下一題'}
  else{m.textContent='再找找看';t.classList.remove('no');void t.offsetWidth;t.classList.add('no')}
}
document.getElementById('ask').onclick=()=>{target?play(target):ask()};

try{votes=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
function renderVote(){
  document.getElementById('g-vote').innerHTML=A.map(a=>`<div class="tile">${pic(a)}<b>${a.n}</b><button class="love" data-id="${a.id}" aria-label="喜歡${a.n}"><span class="h">❤️</span> 我喜歡</button><span class="cnt">${votes[a.id]||0} 票</span></div>`).join('');
  document.querySelectorAll('.love').forEach(b=>b.onclick=()=>doVote(b));
  const sorted=[...A].sort((x,y)=>(votes[y.id]||0)-(votes[x.id]||0)),max=Math.max(1,...A.map(a=>votes[a.id]||0)),top=votes[sorted[0].id]||0;
  document.getElementById('rank').innerHTML=sorted.map((a,i)=>`<li><img src="${IMG[a.id]}" alt="" style="background:${a.c}"><span class="nm">${i===0&&top?'👑 ':''}${a.n}</span><span class="bar"><i style="width:${(votes[a.id]||0)/max*100}%"></i></span><span class="n">${votes[a.id]||0}</span></li>`).join('');
  document.getElementById('vnote').textContent='這是你自己的投票，只記在這台裝置上';
}
function doVote(b){
  const a=A.find(x=>x.id===b.dataset.id);
  play(a);
  votes[a.id]=(votes[a.id]||0)+1;
  try{localStorage.setItem(LS,JSON.stringify(votes))}catch(e){}
  renderVote();
  const nb=document.querySelector('.love[data-id="'+a.id+'"] .h');if(nb)nb.classList.add('pop');
}
document.getElementById('resetVotes').onclick=e=>{
  const b=e.currentTarget;
  if(!rt){b.textContent='再按一次，確定清除';rt=setTimeout(()=>{rt=null;b.textContent='清除票數'},4000);return}
  clearTimeout(rt);rt=null;b.textContent='清除票數';
  try{localStorage.removeItem(LS)}catch(err){}
  votes={};renderVote();
};
/* tabs */
const TABS=['learn','quiz','vote','parent'];
TABS.forEach(n=>{document.getElementById('t-'+n).onclick=()=>{TABS.forEach(x=>{document.getElementById('t-'+x).setAttribute('aria-selected',x===n);document.getElementById('v-'+x).classList.toggle('hidden',x!==n)})}});
renderLearn();renderQuiz();renderVote();
</script>
</body>
